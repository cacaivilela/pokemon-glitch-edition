<!doctype html>
<!-- O DESENHO DO FUNDO DO MAR (src/core/fundoarte.js) de alguns mapas, sem abrir
     o jogo: manda pro /__capture (dev/captures/fundo_<id>.png). ?ids=fundo_route20 -->
<meta charset="utf-8"><title>fundocheck</title>
<script type="module">
import { DB } from "/src/data/index.js";
import { fundoArt } from "/src/core/fundoarte.js";
const ids = (new URLSearchParams(location.search).get("ids") || "fundo_route20,fundo_noronha,fundo_route21_south").split(",");
for (const id of ids) {
  const cv = fundoArt(DB.KANTO[id]);
  await fetch("/__capture", { method: "POST", body: JSON.stringify({ name: id, dataUrl: cv.toDataURL() }) });
}
document.title = "pronto";
</script>
