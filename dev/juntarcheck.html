<!doctype html>
<!-- JUNTAR (DECODIFICADOR): PIPLUP SHINY + PIPLUP ALFA. Tira 3 fotos:
     a lista, o segundo com a prévia e depois de juntar.
     Uso: /dev/juntarcheck.html  (fotos em dev/captures/juntar_*.png) -->
<meta charset="utf-8">
<title>juntarcheck</title>
<style>iframe { width: 480px; height: 320px; }</style>
<script type="module">
const espera = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement("iframe");
// perfil próprio: NUNCA gravar no save.json de quem joga
f.src = "../index.html?map=pallet&party=piplup:10:shiny,bulbasaur:5,piplup:20:alfa&perfil=juntarcheck";
document.body.appendChild(f);
for (let i = 0; i < 50 && !f.contentDocument?.getElementById("screen"); i++) await espera(100);
console.log("P screen", !!f.contentDocument?.getElementById("screen"));
await espera(2500);
for (let i = 0; i < 6; i++) {
  await espera(400);
  for (const type of ["keydown", "keyup"]) f.contentWindow.dispatchEvent(new f.contentWindow.KeyboardEvent(type, { code: "Enter", key: "Enter" }));
}
const foto = async (name, codigo) => { console.log("P foto", name);
  let log = "";
  try { log = String(await f.contentWindow.eval(codigo)); } catch (e) { log = "erro: " + e; }
  await espera(1200);
  const dataUrl = f.contentDocument.getElementById("screen").toDataURL();
  await fetch("/__capture", { method: "POST", body: JSON.stringify({ name, dataUrl, log }) }).catch(() => {});
};
await foto("juntar_menu", `(() => { const t = window.game.scenes.top; t.menu = { type: "genoma", index: 6 }; return t.constructor.name + " party " + window.game.state.party.map(m => m.species + (m.shiny?"*":"") + (m.alfa?"A":"")).join(","); })()`);
await foto("juntar_1", `(() => { const t = window.game.scenes.top; t.escolherJuntar(); return JSON.stringify(t.menu.lista.map(m => m.nickname)); })()`);
await foto("juntar_2", `(() => { const t = window.game.scenes.top, p = window.game.state.party.filter(m => m.species === "piplup"); t.menu = { type: "juntar", index: 0, base: p[0], lista: [p[1]] }; return "ok"; })()`);
await foto("juntar_3", `(() => { const t = window.game.scenes.top, p = window.game.state.party.filter(m => m.species === "piplup"); t.confirmaJuntar(p[0], p[1]); return "perguntou"; })()`);
const aperta = async (n) => { for (let i = 0; i < n; i++) { await espera(500); for (const type of ["keydown", "keyup"]) f.contentWindow.dispatchEvent(new f.contentWindow.KeyboardEvent(type, { code: "KeyZ", key: "z" })); } };
await aperta(3);
await foto("juntar_4", `(() => { const p = window.game.state.party; return p.map(m => m.nickname + " N" + m.level + (m.shiny?" SHINY":"") + (m.alfa?" ALFA":"") + " item=" + m.item).join(" | "); })()`);
await aperta(1);
await foto("juntar_5", `"fim"`);
</script>
