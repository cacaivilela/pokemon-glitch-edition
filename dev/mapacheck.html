<!doctype html>
<!-- O DESENHO DE UM MAPA DE PLANTA (Braglitch, Kalos) num retrato só: pinta
     DB.KANTO[?mapa] com Assets.braglitchArt e manda pro /__capture
     (dev/captures/mapa_<id>.png). Não abre o jogo nem mexe em save.
     Uso: /dev/mapacheck.html?mapa=lumiose -->
<meta charset="utf-8"><title>mapacheck</title>
<body style="background:#222">
<script type="module">
import { DB } from "../src/data/index.js";
import { Assets } from "../src/core/assets.js";
const id = new URLSearchParams(location.search).get("mapa") || "lumiose";
Assets.init();
const cv = Assets.braglitchArt(DB.KANTO[id]);
document.body.appendChild(cv);
await fetch("/__capture", { method: "POST", body: JSON.stringify({ name: `mapa_${id}`, dataUrl: cv.toDataURL(), log: id }) });
document.title = "mapacheck pronto";
</script>
