<!doctype html>
<!-- A TROCA DA SALA DA LIGA: abre o jogo já começando a troca e tira várias
     fotos seguidas (dev/captures/liga_<n>.png). Uso: /dev/ligacheck.html?etapa=0 -->
<meta charset="utf-8"><title>ligacheck</title>
<style>iframe{position:absolute;left:-2000px;width:720px;height:480px}</style>
<script type="module">
const q = new URLSearchParams(location.search), espera = (ms) => new Promise((r) => setTimeout(r, ms));
const etapa = q.get("etapa") || 0;
const f = document.createElement("iframe");
f.src = `../index.html?map=pokemon_league_loreleis_room&x=6&y=${q.has("entrada") ? 10 : 7}&dir=up&starter=charizard:70&badges=8&ligaetapa=${etapa}&${q.has("entrada") ? "ligaentrada=1" : "ligatroca=1"}&perfil=ligacheck`;
document.body.appendChild(f);
for (let i = 0; i < 80 && !f.contentDocument?.getElementById("screen"); i++) await espera(100);
await espera(2500);
for (let i = 0; i < 4; i++) { await espera(300); for (const type of ["keydown", "keyup"]) f.contentWindow.dispatchEvent(new f.contentWindow.KeyboardEvent(type, { code: "Enter", key: "Enter" })); }
const tempos = (q.get("tempos") || "0,600,1500,2100,2700,3200,3950,4600").split(",").map(Number);
const t0 = performance.now();
for (let i = 0; i < tempos.length; i++) {
  while (performance.now() - t0 < tempos[i]) await espera(20);
  const dataUrl = f.contentDocument.getElementById("screen").toDataURL();
  await fetch("/__capture", { method: "POST", body: JSON.stringify({ name: `liga_${i}`, dataUrl, log: String(tempos[i]) }) });
}
document.title = "ligacheck pronto";
</script>
