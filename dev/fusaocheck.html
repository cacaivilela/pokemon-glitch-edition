<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>checagem da fusão</title>
<style>
  body { background:#111; color:#9fd; font:13px/1.45 ui-monospace,monospace; margin:0; padding:10px; }
  .erro { color:#f66; }
  .ok { color:#7f7; }
  h2 { color:#b455ff; font-size:13px; margin:10px 0 2px; }
</style>
</head>
<body>
<div id="out">rodando...</div>
<img id="hold" alt="" width="1" height="1" src="/__delay?ms=8000">
<canvas id="screen" width="240" height="160" hidden></canvas>
<script type="module">
// Checagem sem jogo: monta espécies de fusão, funde, separa e confere as contas.
const out = document.getElementById("out");
const linhas = [];
const p = (t, cls = "") => linhas.push(`<div class="${cls}">${t}</div>`);
const h = (t) => linhas.push(`<h2>${t}</h2>`);
try {
  const { DB } = await import("/src/data/index.js");
  const { createMon, recalc } = await import("/src/systems/mon.js");
  const F = await import("/src/systems/fusao.js");

  h("NOMES");
  for (const [a, b] of [["bulbasaur","charmander"],["charmander","bulbasaur"],["pikachu","squirtle"],
                        ["squirtle","pikachu"],["mewtwo","mew"],["missingno","gengar"],["gengar","missingno"]]) {
    const sp = F.montarEspecie(a, b);
    p(`${a} + ${b} = ${sp.name} [${sp.types.join("/")}] TOTAL ${sp.bst} ${sp.codigo} id=${sp.id}`);
  }

  h("ATRIBUTOS (2/3 de quem manda)");
  const sp = F.montarEspecie("bulbasaur", "charmander");
  const cab = DB.SPECIES.bulbasaur.base, cor = DB.SPECIES.charmander.base;
  p(`cabeça bulbasaur ${JSON.stringify(cab)}`);
  p(`corpo charmander ${JSON.stringify(cor)}`);
  p(`fusão            ${JSON.stringify(sp.base)}`);
  const espHp = Math.floor((2*cab.hp + cor.hp)/3), espAtk = Math.floor((2*cor.atk + cab.atk)/3);
  p(`hp ${sp.base.hp}==${espHp} e atk ${sp.base.atk}==${espAtk}`,
    sp.base.hp === espHp && sp.base.atk === espAtk ? "ok" : "erro");
  p(`golpes: ${sp.learnset.map(([l,m]) => l+":"+m).join(" ")}`);

  h("FUNDIR / SEPARAR");
  const estado = { party: [], boxes: [], fusoes: {} };
  F.ligarEstado(estado);
  const a = createMon("bulbasaur", 12), b = createMon("charmander", 9);
  a.hp = Math.round(a.maxHp * 0.5);
  const fus = F.fundir(a, b);
  DB.SPECIES[fus.species] = F.montarEspecie("bulbasaur", "charmander");
  p(`fundiu: ${fus.nickname} nv${fus.level} hp ${fus.hp}/${fus.maxHp} tipos ${fus.types.join("/")}`);
  p(`golpes da fusão: ${fus.moves.map((m) => m.id).join(", ")}`);
  p(`nível = max(12,9) -> ${fus.level}`, fus.level === 12 ? "ok" : "erro");
  p(`guarda os dois dentro: ${!!fus.fusao?.cabeca} ${!!fus.fusao?.corpo}`, fus.fusao ? "ok" : "erro");
  const [c1, c2] = F.separar(fus);
  p(`separou: ${c1.nickname} nv${c1.level} hp ${c1.hp}/${c1.maxHp} | ${c2.nickname} nv${c2.level} hp ${c2.hp}/${c2.maxHp}`);
  p(`voltou como as espécies certas: ${c1.species}/${c2.species}`,
    c1.species === "bulbasaur" && c2.species === "charmander" ? "ok" : "erro");
  p(`os dois sobem pro nível da fusão: ${c1.level}/${c2.level}`, c1.level === 12 && c2.level === 12 ? "ok" : "erro");

  h("FICHA DO JOGADOR (oficina)");
  const ficha = F.fichaParaEditar("bulbasaur", "charmander");
  p(`ficha automática: ${JSON.stringify(ficha)}`);
  ficha.nome = "TESTEMON";
  ficha.tipos = ["FANTASMA", "AÇO"];
  ficha.crescimento.hp = 3;
  ficha.crescimento.atk = 2;
  ficha.inicial.hp = 20;
  const sp2 = F.salvarFicha(estado, "bulbasaur", "charmander", ficha);
  p(`espécie com ficha: ${sp2.name} [${sp2.types.join("/")}] TOTAL(nv50) ${sp2.bst}`);
  const mon = createMon(sp2.id, 10);
  p(`nv10 -> hp ${mon.maxHp} (esperado ${20 + 3*10}) atk ${mon.stats.atk} (esperado ${5 + 2*10})`,
    mon.maxHp === 50 && mon.stats.atk === 25 ? "ok" : "erro");
  mon.level = 50; recalc(mon);
  p(`nv50 -> hp ${mon.maxHp} atk ${mon.stats.atk}`, mon.maxHp === 170 && mon.stats.atk === 105 ? "ok" : "erro");
  p(`nome herdado pelo apelido: ${mon.nickname}`, mon.nickname === "TESTEMON" ? "ok" : "erro");
  F.apagarFicha(estado, "bulbasaur", "charmander");
  p(`apagou a ficha: ${DB.SPECIES[sp2.id].name}`, DB.SPECIES[sp2.id].name !== "TESTEMON" ? "ok" : "erro");

  h("REGISTRO A PARTIR DO SAVE");
  const salvo = { player: {}, party: [{ species: fus.species, level: 12, ivs: {}, moves: [] }], boxes: [] };
  delete DB.SPECIES[fus.species];
  F.registrarDoEstado(salvo);
  p(`espécie remontada do id: ${DB.SPECIES[fus.species]?.name}`, DB.SPECIES[fus.species] ? "ok" : "erro");

  h("BANCADA LIVRE (DIGITAR)");
  for (const t of ["025", "25", "PIKACHU", "pikachu", "MEWTWO", "1", "151", "641", "TORNADUS", "mr mime", "MR. MIME", "nidoran m", "PORYGON-Z", "XYZ", "999", ""]) {
    const sp = F.especiePorTexto(t);
    p(`  "${t}" -> ${sp ? sp.name + " (" + sp.id + ", dex " + sp.dex + ")" : "não achou"}`);
  }
  {
    const achou = (t, id) => F.especiePorTexto(t)?.id === id;
    p("número e nome dão o mesmo bicho",
      achou("025", "pikachu") && achou("PIKACHU", "pikachu") ? "ok" : "erro");
    p("aceita espécie de fora de Kanto pelo número (641)", achou("641", "tornadus") ? "ok" : "erro");
    p("lixo não vira espécie", !F.especiePorTexto("XYZ") && !F.especiePorTexto("") ? "ok" : "erro");
    const sp = F.montarEspecie("mewtwo", "tornadus");
    p(`dupla que ninguém tem: ${sp.name} [${sp.types.join("/")}]`, sp ? "ok" : "erro");
  }

  h("O BRILHO PEGA (SHINY)");
  {
    const estS = { player: {}, party: [], boxes: [], fusoes: {} };
    F.ligarEstado(estS);
    const comum = createMon("pikachu", 20);
    const brilha = createMon("bulbasaur", 22, { shiny: true });
    p(`antes: pikachu shiny=${!!comum.shiny}, bulbasaur shiny=${!!brilha.shiny}`);
    const fx = F.fundir(comum, brilha);
    DB.SPECIES[fx.species] = F.montarEspecie("pikachu", "bulbasaur");
    p(`a fusão saiu shiny: ${!!fx.shiny}`, fx.shiny ? "ok" : "erro");
    p(`os dois guardados dentro: cabeça=${!!fx.fusao.cabeca.shiny} corpo=${!!fx.fusao.corpo.shiny}`,
      fx.fusao.cabeca.shiny && fx.fusao.corpo.shiny ? "ok" : "erro");
    p(`avisa que o brilho pegou: ${!!fx.brilhouNaFusao}`, fx.brilhouNaFusao ? "ok" : "erro");
    const [c1, c2] = F.separar(fx);
    p(`separou: ${c1.species} shiny=${!!c1.shiny} | ${c2.species} shiny=${!!c2.shiny}`,
      c1.shiny && c2.shiny ? "ok" : "erro");
    const fy = F.fundir(createMon("rattata", 10), createMon("pidgey", 10));
    p(`dois comuns continuam comuns: ${!!fy.shiny}`, !fy.shiny ? "ok" : "erro");
    const fz = F.fundir(createMon("abra", 10, { shiny: true }), createMon("kadabra", 10, { shiny: true }));
    p(`dois shiny: brilhouNaFusao=${!!fz.brilhouNaFusao} (não precisa avisar)`, !fz.brilhouNaFusao ? "ok" : "erro");
  }

  h("TROCAR A VERSÃO DE QUEM JÁ ESTÁ FUNDIDO");
  {
    const stV = { player: {}, party: [], boxes: [], fusoes: {} };
    F.ligarEstado(stV);
    const fus = F.fundir(createMon("electabuzz", 40), createMon("poliwag", 36));
    DB.SPECIES[fus.species] = F.montarEspecie("electabuzz", "poliwag");
    fus.hp = Math.round(fus.maxHp * 0.5);
    p(`fundiu: ${fus.nickname} nv${fus.level} hp ${fus.hp}/${fus.maxHp} (versão automática)`);
    const vs = F.variantes("electabuzz", "poliwag");
    p(`versões dessa dupla: ${vs.map((v) => v.rotulo + (v.ficha?.nome ? " (" + v.ficha.nome + ")" : "")).join(" | ")}`,
      vs.length > 1 ? "ok" : "erro");
    const outra = vs.find((v) => v.variante);
    const sp = F.trocarVariante(fus, outra.variante);
    p(`trocou pra: ${sp.name} [${sp.types.join("/")}] species=${fus.species}`,
      fus.species.includes("~" + outra.variante) ? "ok" : "erro");
    p(`continua sendo ele: nv${fus.level} hp ${fus.hp}/${fus.maxHp} e guarda os dois: ${!!fus.fusao}`,
      fus.level === 40 && fus.fusao ? "ok" : "erro");
    const voltou = F.trocarVariante(fus, "");
    p(`e dá pra voltar pra automática: ${voltou.name}`, !fus.species.includes("~") ? "ok" : "erro");
    const [c1, c2] = F.separar(fus);
    p(`separar continua devolvendo os dois: ${c1.species} + ${c2.species}`,
      c1.species === "electabuzz" && c2.species === "poliwag" ? "ok" : "erro");
  }

  h("IMPORTAR FICHA (DO FUSIONGLITCH)");
  {
    const stI = { player: {}, party: [], boxes: [], fusoes: {} };
    F.ligarEstado(stI);
    const arquivo = JSON.stringify({
      chave: "pikachu+onix",
      ficha: { id: "pikonix", nome: "PIKONIX", autor: "SITE", tipos: ["ELÉTRICO", "PEDRA"],
               inicial: { hp: 14 }, crescimento: { hp: 3, atk: 2.2, def: 4, spa: 1.5, spd: 1.5, spe: 1.2 },
               sprite: "data:image/png;base64,iVBORw0KGgo=", lore: "VEIO DO SITE." },
    });
    const r = F.importarFicha(stI, arquivo);
    p(`importou: ${r.ok ? r.sp.name + " [" + r.sp.types.join("/") + "]" : r.erro}`, r.ok ? "ok" : "erro");
    p(`entrou nas variantes: ${F.variantes("pikachu", "onix").map((v) => v.rotulo).join(" | ")}`,
      F.temFicha("pikachu", "onix") ? "ok" : "erro");
    const m2 = createMon(F.idFusao("pikachu", "onix"), 30);
    p(`nv30 pelo crescimento da ficha: hp ${m2.maxHp} def ${m2.stats.def}`,
      m2.maxHp === 14 + 3 * 30 && m2.stats.def === 5 + 4 * 30 ? "ok" : "erro");
    for (const [caso, txt] of [
      ["arquivo de outra coisa", '{"oi":1}'],
      ["texto quebrado", "{{{"],
      ["dupla que não existe", '{"chave":"xyz+abc","ficha":{"nome":"X","tipos":["FOGO"]}}'],
      ["tipo inventado", '{"chave":"pikachu+onix","ficha":{"nome":"X","tipos":["PIZZA"]}}'],
      ["desenho que não é PNG", '{"chave":"pikachu+onix","ficha":{"nome":"X","tipos":["FOGO"],"sprite":"data:text/html,<b>"}}'],
    ]) {
      const rr = F.importarFicha(stI, txt);
      p(`  recusa ${caso}: ${rr.erro || "DEIXOU PASSAR!"}`, !rr.ok ? "ok" : "erro");
    }
  }

  h("VARIANTES DA DUPLA");
  for (const [a3, b3] of [["gengar","rayquaza"],["pikachu","bulbasaur"],["charmander","pidgeot"]]) {
    const vs = F.variantes(a3, b3);
    p(`${a3}+${b3}: ${vs.map((v) => v.rotulo + (v.ficha?.nome ? " (" + v.ficha.nome + ")" : "")).join("  |  ")}`);
    for (const v of vs) {
      const sp2 = F.montarEspecie(a3, b3, v.variante);
      p(`   ${v.variante || "(auto)"} -> ${sp2 ? sp2.name + " [" + sp2.types.join("/") + "] id=" + sp2.id : "NULO"}`, sp2 ? "ok" : "erro");
    }
  }
  {
    const est3 = { player: {}, party: [], boxes: [], fusoes: {} };
    F.ligarEstado(est3);
    const idv = F.idFusao("gengar","rayquaza","gengquaza");
    F.garantirEspecie(idv);
    const m1 = createMon(idv, 50);
    p(`GENGQUAZA nv50: ${m1.nickname} hp ${m1.maxHp} atk ${m1.stats.atk} spa ${m1.stats.spa} spe ${m1.stats.spe} [${m1.types.join("/")}]`,
      m1.maxHp === 12 + Math.floor(2.6*50) ? "ok" : "erro");
    const a4 = createMon("gengar", 40), b4 = createMon("rayquaza", 40);
    const fus2 = F.fundir(a4, b4, "gengquaza");
    p(`fundir com variante: ${fus2.nickname} species=${fus2.species}`, fus2.species.includes("~gengquaza") ? "ok" : "erro");
    const [p1, p2] = F.separar(fus2);
    p(`separar devolve ${p1.species} + ${p2.species}`, p1.species === "gengar" && p2.species === "rayquaza" ? "ok" : "erro");
    delete DB.SPECIES[fus2.species];
    F.registrarDoEstado({ player: {}, party: [fus2], boxes: [] });
    p(`variante remontada do save: ${DB.SPECIES[fus2.species]?.name}`, DB.SPECIES[fus2.species] ? "ok" : "erro");
  }

  h("CONCURSO DE CINNABAR");
  const K = await import("/src/systems/concurso.js");
  F.ligarEstado(estado);
  for (const [a2, b2] of [["charmander","pidgeot"],["gengar","onix"],["magikarp","magikarp"]]) {
    const j = K.julgar(a2, b2);
    p(`${j.sp.name}: harmonia ${j.notas.harmonia} potência ${j.notas.potencia} autoria ${j.notas.autoria} = ${j.total}`);
  }
  const comFicha = F.fichaParaEditar("charmander", "pidgeot");
  comFicha.nome = "MEUBICHO"; comFicha.sprite = "data:image/png;base64,x"; comFicha.tipos = ["FOGO","VOADOR"];
  F.salvarFicha(estado, "charmander", "pidgeot", comFicha);
  const jf = K.julgar("charmander", "pidgeot");
  p(`autoria com desenho e nome próprios: ${jf.notas.autoria} (antes 2)`, jf.notas.autoria > 2 ? "ok" : "erro");
  const est2 = { player: {}, party: [], boxes: [], badges: ["pedra"], flags: {}, items: {}, money: 0 };
  F.ligarEstado(est2);
  const r = K.rodada(est2, { ...K.julgar("charmander","pidgeot"), dono: "EU" });
  p(`rodada: ${r.entradas.length} entradas, você em ${r.colocacao}º`);
  p(r.ordem.map((e) => `${e.dono || "EU"} ${e.sp.name} ${e.total}`).join(" | "));
  p(`prêmio 1º: ${JSON.stringify(K.premio(est2, 1))}`);
  p(`prêmio 1º repetido: ${JSON.stringify(K.premio({ flags: { concursoOuro: true } }, 1))}`);
  p(`prêmio 5º: ${JSON.stringify(K.premio(est2, 5))}`);

  h("PALCO NO MAPA");
  p(`NPCs em cinnabar_island: ${(DB.MAPS.cinnabar_island.npcs || []).map((n) => n.id + "@" + n.x + "," + n.y).join(" ")}`);

  h("SIDE QUESTS");
  const Q = await import("/src/systems/missoes.js");
  p(`${DB.MISSOES.length} missões: ${DB.MISSOES.map((m) => m.nome).join(" | ")}`);
  const vistos = new Set();
  for (const m of DB.MISSOES) {
    const mapa = DB.MAPS[m.mapa];
    const lugar = `${m.mapa}.${m.x},${m.y}`;
    // NPC com fila de pedidos entra uma vez só: o segundo em diante é o mesmo
    const primeiro = !vistos.has(lugar);
    vistos.add(lugar);
    const npc = (mapa?.npcs || []).find((n) => n.missao && n.x === m.x && n.y === m.y);
    if (!primeiro) { p(`  ${m.nome}: mesmo NPC de ${lugar}`, npc ? "ok" : "erro"); continue; }
    const geo = DB.KANTO[m.mapa];
    const tag = geo ? geo.tags[m.y * geo.w + m.x] : "?";
    const vizinhos = (mapa?.npcs || []).filter((n) => n.x === m.x && n.y === m.y);
    const portas = (geo?.warps || []).some((wp) => wp.x === m.x && wp.y === m.y - 1);
    p(`  ${m.mapa} (${m.x},${m.y}) tag=${tag} npc=${npc ? "no mapa" : "SUMIU"}` +
      `${vizinhos.length > 1 ? " EM CIMA DE OUTRO NPC" : ""}${portas ? " NA FRENTE DE UMA PORTA" : ""}`,
      npc && tag === "0" && vizinhos.length === 1 && !portas ? "ok" : "erro");
  }
  {
    const st = { party: [], boxes: [], caught: {}, items: {}, money: 0, flags: {}, fusoes: {}, missoes: {} };
    p(`antes de falar com ninguém: diário tem ${Q.diario(st).length} linha(s)`, Q.diario(st).length === 0 ? "ok" : "erro");
    Q.aceitar(st, "isca");
    p(`aceitou ISCA -> ${Q.estado(st, "isca")}`, Q.estado(st, "isca") === "ativa" ? "ok" : "erro");
    st.party.push(createMon("magikarp", 5));
    p(`com um MAGIKARP -> ${Q.estado(st, "isca")}`, Q.estado(st, "isca") === "pronta" ? "ok" : "erro");
    const linhas = Q.entregar(st, "isca");
    p(`entregou: ${linhas.join(" / ")}`);
    p(`dinheiro ${st.money}, itens ${JSON.stringify(st.items)} -> ${Q.estado(st, "isca")}`,
      st.money === 1200 && st.items["doce raro"] === 2 && Q.estado(st, "isca") === "feita" ? "ok" : "erro");

    for (const id of ["caterpie", "weedle", "paras", "venonat", "scyther"]) st.caught[id] = true;
    const ins = Q.progresso(st, "insetos");
    p(`insetos: ${ins.atual}/${ins.alvo}`, ins.feito ? "ok" : "erro");
    st.caught.porygon2 = true;
    p(`espécie de fora capturada: ${Q.progresso(st, "fenda").feito}`, Q.progresso(st, "fenda").feito ? "ok" : "erro");
    st.flags.concursoRecorde = 21.4;
    p(`troféu (20 pontos): ${Q.progresso(st, "trofeu").atual}/${Q.progresso(st, "trofeu").alvo}`,
      Q.progresso(st, "trofeu").feito ? "ok" : "erro");
    const fus3 = F.fundir(createMon("gengar", 30), createMon("haunter", 28));
    st.party.push(fus3);
    p(`fusão na equipe: ${Q.progresso(st, "primeira-fusao").feito}`, Q.progresso(st, "primeira-fusao").feito ? "ok" : "erro");
    st.fusoes["gengar+haunter"] = { nome: "X", sprite: "data:image/png;base64,x" };
    p(`ficha desenhada: ${Q.progresso(st, "retrato").feito}`, Q.progresso(st, "retrato").feito ? "ok" : "erro");
    st.party.push(createMon("bulbasaur", 5), createMon("charmander", 5), createMon("squirtle", 5));
    const tri = Q.progresso(st, "trio");
    p(`trio inicial: ${tri.atual}/${tri.alvo}`, tri.feito ? "ok" : "erro");
    Q.aceitar(st, "trio"); Q.aceitar(st, "insetos");
    p(`diário: ${Q.diario(st).map((l) => l.missao.nome + "=" + l.estado).join(", ")}`);
  }

  h("PARADOS EM KANTO");
  for (const e of DB.ESTATICOS || []) {
    const sp = DB.SPECIES[e.id];
    const geo = DB.KANTO[e.mapa];
    const tag = geo ? geo.tags[e.y * geo.w + e.x] : "?";
    const frente = geo ? geo.tags[(e.y + 1) * geo.w + e.x] : "?";
    const outro = (DB.MAPS[e.mapa]?.npcs || []).some((n) => n.x === e.x && n.y === e.y);
    p(`  ${sp?.name} [${sp?.types.join("/")}] em ${e.mapa} (${e.x},${e.y}) nv${e.nivel} ` +
      `tag=${tag} chega-por=${frente}${outro ? " EM CIMA DE OUTRO NPC" : ""}`,
      sp && tag === "0" && frente === "0" && !outro ? "ok" : "erro");
  }
  {
    // o pedido é a chave: sem ele, o lugar é só o lugar
    const stX = { party: [], boxes: [], caught: {}, items: {}, money: 0, flags: {}, badges: [], missoes: {} };
    const visivel = (e) => (!e.missao || stX.missoes[e.missao]) && !stX.caught[e.id];
    p(`sem nenhuma missão aceita, aparecem: ${(DB.ESTATICOS || []).filter(visivel).length}`,
      (DB.ESTATICOS || []).filter(visivel).length === 0 ? "ok" : "erro");
    stX.badges = ["a","b","c","d"];
    const vX = Q.daVez(stX, "x-marca-o-lugar");
    p(`com 4 insígnias o museu oferece: ${vX.missao?.nome}`, vX.missao?.id === "x-marca-o-lugar" && !vX.travada ? "ok" : "erro");
    Q.aceitar(stX, "x-marca-o-lugar");
    p(`aceitou -> aparece só o XERNEAS: ${(DB.ESTATICOS || []).filter(visivel).map((e) => e.id).join(",")}`,
      (DB.ESTATICOS || []).filter(visivel).length === 1 ? "ok" : "erro");
    stX.caught.xerneas = true;
    p(`capturou -> missão ${Q.estado(stX, "x-marca-o-lugar")} e ele some do mapa: ${(DB.ESTATICOS || []).filter(visivel).length === 0}`,
      Q.estado(stX, "x-marca-o-lugar") === "pronta" ? "ok" : "erro");
    const linhas = Q.entregar(stX, "x-marca-o-lugar");
    p(`entregou: $${stX.money}`, stX.money === 9000 ? "ok" : "erro");
    p(`Y e Z travados sem insígnia: ${Q.daVez(stX, "y-da-morte").travada} / ${Q.daVez(stX, "z-do-dna").travada}`,
      Q.daVez(stX, "y-da-morte").travada && Q.daVez(stX, "z-do-dna").travada ? "ok" : "erro");
  }
  {
    const ef = DB.effectiveness;
    p(`FADA existe: ${DB.TYPES.includes("FADA")}`, DB.TYPES.includes("FADA") ? "ok" : "erro");
    p(`FADA em DRAGÃO = ${ef("FADA", ["DRAGÃO"])}x, DRAGÃO em FADA = ${ef("DRAGÃO", ["FADA"])}x`,
      ef("FADA", ["DRAGÃO"]) === 2 && ef("DRAGÃO", ["FADA"]) === 0 ? "ok" : "erro");
    p(`VENENO e AÇO em FADA = ${ef("VENENO", ["FADA"])}x / ${ef("AÇO", ["FADA"])}x`,
      ef("VENENO", ["FADA"]) === 2 && ef("AÇO", ["FADA"]) === 2 ? "ok" : "erro");
    p(`LUTADOR, INSETO e SOMBRIO em FADA = ${ef("LUTADOR", ["FADA"])}/${ef("INSETO", ["FADA"])}/${ef("SOMBRIO", ["FADA"])}`,
      ef("LUTADOR", ["FADA"]) === 0.5 && ef("SOMBRIO", ["FADA"]) === 0.5 ? "ok" : "erro");
    p(`YVELTAL contra ZYGARDE: ${ef("SOMBRIO", DB.SPECIES.zygarde.types)}x`);
    p(`cor do tipo: ${DB.TYPE_COLOR.FADA}`, DB.TYPE_COLOR.FADA ? "ok" : "erro");
    const m = createMon("xerneas", 60);
    p(`XERNEAS nv60: hp ${m.maxHp} atk ${m.stats.atk} golpes ${m.moves.map((g) => g.id).join(",")}`,
      m.maxHp > 0 && m.moves.length ? "ok" : "erro");
  }

  h("A TEMPESTADE (LENDÁRIOS)");
  {
    const geo = DB.KANTO.tempestade;
    const pedra = (x, y) => geo.tags[y * geo.w + x] === "0";
    p(`mapa ${geo.w}x${geo.h}, recife com ${[...geo.tags].filter((t) => t === "0").length} tiles`);
    p(`chegada (10,10) e barco (11,10) em pedra: ${pedra(10,10)} / ${pedra(11,10)}`, pedra(10,10) && pedra(11,10) ? "ok" : "erro");
    p(`o lendário (9,6) em pedra: ${pedra(9,6)}`, pedra(9,6) ? "ok" : "erro");
    for (const id of DB.TEMPESTADE || ["tornadus","thundurus","landorus"]) {
      const sp = DB.SPECIES[id];
      p(`  ${sp?.name} [${sp?.types.join("/")}] dex ${sp?.dex} total ${sp?.bst}`, sp ? "ok" : "erro");
    }
    const st2 = { party: [], boxes: [], caught: {}, items: {}, money: 0, flags: {}, badges: [], missoes: {} };
    p(`sem insígnia: ${JSON.stringify(Q.daVez(st2, "tempestade").travada)} (travada)`,
      Q.daVez(st2, "tempestade").travada ? "ok" : "erro");
    st2.badges = ["pedra", "cascata", "trovao"];
    const v1 = Q.daVez(st2, "tempestade");
    p(`com 3 insígnias, o marinheiro oferece: ${v1.missao.nome}`, v1.missao.id === "tempestade" && !v1.travada ? "ok" : "erro");
    Q.aceitar(st2, "tempestade");
    st2.caught.tornadus = true;
    p(`capturou TORNADUS -> ${Q.estado(st2, "tempestade")}`, Q.estado(st2, "tempestade") === "pronta" ? "ok" : "erro");
    Q.entregar(st2, "tempestade");
    const v2 = Q.daVez(st2, "tempestade");
    p(`agora ele oferece: ${v2.missao.nome}`, v2.missao.id === "tempestade-raio" ? "ok" : "erro");
    st2.caught.thundurus = true; Q.aceitar(st2, "tempestade-raio"); Q.entregar(st2, "tempestade-raio");
    const v3 = Q.daVez(st2, "tempestade");
    p(`e depois: ${v3.missao.nome}`, v3.missao.id === "tempestade-chao" ? "ok" : "erro");
    st2.caught.landorus = true; Q.aceitar(st2, "tempestade-chao"); Q.entregar(st2, "tempestade-chao");
    p(`os três entregues -> ${JSON.stringify(Q.daVez(st2, "tempestade").missao)}`,
      Q.daVez(st2, "tempestade").missao === null ? "ok" : "erro");
    p(`dinheiro somado das três: $${st2.money}`, st2.money === 25000 ? "ok" : "erro");
  }

  h("IDIOMA E VELOCIDADE");
  const { usarIdioma, traduz, idiomaAtual } = await import("/src/core/idioma.js");
  const { Opcoes } = await import("/src/core/opcoes.js");
  p(`sem dicionário: "${traduz("MOCHILA")}" (fica igual)`, traduz("MOCHILA") === "MOCHILA" ? "ok" : "erro");
  usarIdioma("en", DB.DICIONARIOS.en);
  p(`en: MOCHILA -> ${traduz("MOCHILA")} | FUNDIR -> ${traduz("FUNDIR")} | ÁGUA -> ${traduz("ÁGUA")}`,
    traduz("MOCHILA") === "BAG" && traduz("FUNDIR") === "FUSE" ? "ok" : "erro");
  p(`sem tradução volta o original: "${traduz("CHARMANDER")}"`, traduz("CHARMANDER") === "CHARMANDER" ? "ok" : "erro");
  p(`traduzir duas vezes não estraga: "${traduz(traduz("MOCHILA"))}"`, traduz(traduz("MOCHILA")) === "BAG" ? "ok" : "erro");
  usarIdioma("es", DB.DICIONARIOS.es);
  p(`es: NOVO JOGO -> ${traduz("NOVO JOGO")} | INSÍGNIAS -> ${traduz("INSÍGNIAS")}`,
    traduz("NOVO JOGO") === "JUEGO NUEVO" ? "ok" : "erro");
  usarIdioma("pt", null);
  p(`de volta ao pt: ${traduz("MOCHILA")} (${idiomaAtual()})`, traduz("MOCHILA") === "MOCHILA" ? "ok" : "erro");
  const antes = Opcoes.get("velocidade");
  Opcoes.set("velocidade", 1.5);
  p(`opções gravam: velocidade ${Opcoes.get("velocidade")}`, Opcoes.get("velocidade") === 1.5 ? "ok" : "erro");
  const quadros = (base, v) => Math.max(2, Math.round(base / v));
  p(`andar 1 tile: ${[0.5,1,1.5,2].map((v) => v + "x=" + quadros(16, v) + "q").join("  ")}`);
  Opcoes.set("velocidade", antes ?? 1);

  h("MÓDULOS CARREGAM");
  for (const m of ["/src/data/story.js", "/src/data/fusao.js", "/src/scenes/fusion.js",
                   "/src/scenes/fusaoeditor.js", "/src/scenes/overworld.js", "/src/core/input.js",
                   "/src/data/concurso.js", "/src/scenes/concurso.js",
                   "/src/data/fusoes.js", "/src/data/fusoes-feitas.js",
                   "/src/data/idiomas.js", "/src/core/idioma.js", "/src/core/opcoes.js",
                   "/src/scenes/title.js", "/src/data/missoes.js", "/src/systems/missoes.js", "/src/data/extra.js"]) {
    try { await import(m); p(`${m}`, "ok"); }
    catch (e) { p(`${m}: ${e.message}`, "erro"); }
  }

  h("SPRITE");
  const { Assets } = await import("/src/core/assets.js");
  Assets.init();
  const img = Assets.mon(fus.species, 7);
  p(`sprite montado: ${img.width}x${img.height}`, img && img.width > 0 ? "ok" : "erro");
} catch (e) {
  p("EXPLODIU: " + (e?.stack || e), "erro");
}
out.innerHTML = linhas.join("");
// manda o resultado pro dev server (o --screenshot dispara antes disto terminar)
try {
  await fetch("/__capture", { method: "POST", body: JSON.stringify({
    name: "fusaocheck",
    log: linhas.join("\n").replace(/<[^>]+>/g, ""),
    dataUrl: document.getElementById("screen").toDataURL(),
  }) });
} catch (e) {}
document.title = "pronto";
</script>
</body>
</html>
